<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Natural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="header-color"></div>
        <div class="content">
            <!-- ========================================================== -->
            <!-- 1. GANTI FOTO                                              -->
            <!-- 1. Masukkan file foto Anda ke dalam folder "foto"          -->
            <!-- 2. Ganti "foto-anda.jpg" dengan nama file foto Anda        -->
            <!-- ========================================================== -->
            <img src="foto/foto.jpeg" alt="Foto Profil" class="profile-img">
            
            <!-- ========================================================== -->
            <!-- 2. GANTI NAMA                                              -->
            <!-- Tulis nama Anda di antara tag <h1> dan </h1>               -->
            <!-- ========================================================== -->
            <h1 class="name">Aloo kenalin nama ku cahya</h1>
            
            <!-- ========================================================== -->
            <!-- 3. GANTI PROFESI                                           -->
            <!-- Tulis pekerjaan atau jurusan Anda di bawah ini             -->
            <!-- ========================================================== -->
            <p class="profession">Aku dari Jurusan Teknik Informatika, prodi Teknik Informatika</p>
            
            <!-- ========================================================== -->
            <!-- 4. GANTI DESKRIPSI SINGKAT                                 -->
            <!-- Tulis sedikit tentang diri Anda di bawah ini               -->
            <!-- ========================================================== -->
            <p class="description">Fun fact aku gak suka dengan yang berbau durian dan kopi</p>
        </div>
    </div>
</body>
</html>
